<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products — Classic Models</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <a class="sidebar-brand" th:href="@{/}"><span class="brand-icon">🏎</span><span>Classic Models</span></a>
    <div class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a th:href="@{/}" class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a>
      <a th:href="@{/analytics}" class="nav-link"><span class="nav-icon">📊</span> Sales Analytics</a>
      <div class="nav-section-label">Modules</div>
      <a th:href="@{/employees}" class="nav-link"><span class="nav-icon">👤</span> Employees</a>
      <a th:href="@{/customers}" class="nav-link"><span class="nav-icon">🤝</span> Customers</a>
      <a th:href="@{/offices}" class="nav-link"><span class="nav-icon">🏢</span> Offices</a>
      <a th:href="@{/orders}" class="nav-link"><span class="nav-icon">📦</span> Orders</a>
      <a th:href="@{/productlines}" class="nav-link"><span class="nav-icon">📋</span> Product Lines</a>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-breadcrumb">
        <a th:href="@{/}">Home</a><span class="sep">/</span><span>Products</span>
      </div>
      <div class="topbar-title">Products</div>
    </div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <div class="page-header-title">Products</div>
          <div class="page-header-sub" th:text="${count} + ' total products'">0 products</div>
        </div>
        <a th:href="@{/products/new}" class="btn btn-success">+ New Product</a>
      </div>

      <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Product Name</th>
              <th>Product Line</th>
              <th>Scale</th>
              <th>Vendor</th>
              <th>Stock</th>
              <th>Buy Price</th>
              <th>MSRP</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${products == null or products.isEmpty()}">
              <td colspan="9">
                <div class="empty-state">
                  <div class="empty-state-icon">🚗</div>
                  <div class="empty-state-title">No products found</div>
                </div>
              </td>
            </tr>
            <tr th:each="p : ${products}">
              <td th:text="${p.productCode}">-</td>
              <td><strong th:text="${p.productName}">-</strong></td>
              <td th:text="${p.productLineEntity != null ? p.productLineEntity.productLine : '—'}">-</td>
              <td th:text="${p.productScale}">-</td>
              <td th:text="${p.productVendor}">-</td>
              <td>
                <span th:class="'badge ' + (${p.quantityInStock < 100} ? 'badge-danger' : (${p.quantityInStock < 1000} ? 'badge-warning' : 'badge-success'))"
                      th:text="${p.quantityInStock}">-</span>
              </td>
              <td class="money" th:text="${p.buyPrice != null ? '$' + #numbers.formatDecimal(p.buyPrice,1,2) : '—'}">-</td>
              <td class="money" th:text="${p.MSRP != null ? '$' + #numbers.formatDecimal(p.MSRP,1,2) : '—'}">-</td>
              <td>
                <div class="btn-group">
                  <a th:href="@{/products/{code}(code=${p.productCode})}" class="btn btn-secondary btn-sm">View</a>
                  <a th:href="@{/products/{code}/edit(code=${p.productCode})}" class="btn btn-warning btn-sm">Edit</a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
