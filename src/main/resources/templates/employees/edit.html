<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="'Edit Employee — Classic Models'">Edit Employee</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <a class="sidebar-brand" th:href="@{/}"><span class="brand-icon">🏎</span><span>Classic Models</span></a>
    <div class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a th:href="@{/}" class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a>
      <a th:href="@{/analytics}" class="nav-link"><span class="nav-icon">📊</span> Sales Analytics</a>
      <div class="nav-section-label">Modules</div>
      <a th:href="@{/employees}" class="nav-link active"><span class="nav-icon">👤</span> Employees</a>
      <a th:href="@{/customers}" class="nav-link"><span class="nav-icon">🤝</span> Customers</a>
      <a th:href="@{/offices}" class="nav-link"><span class="nav-icon">🏢</span> Offices</a>
      <a th:href="@{/orders}" class="nav-link"><span class="nav-icon">📦</span> Orders</a>
      <a th:href="@{/productlines}" class="nav-link"><span class="nav-icon">📋</span> Product Lines</a>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-breadcrumb">
        <a th:href="@{/}">Home</a><span class="sep">/</span>
        <a th:href="@{/employees}">Employees</a><span class="sep">/</span>
        <a th:href="@{/employees/{id}(id=${employee.employeeNumber})}" th:text="${employee.firstName + ' ' + employee.lastName}">Employee</a><span class="sep">/</span>
        <span>Edit</span>
      </div>
      <div class="topbar-title">Edit Employee</div>
    </div>
    <div class="page-content">
      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <div class="page-header">
        <div>
          <div class="page-header-title">Edit Employee</div>
          <div class="page-header-sub" th:text="'#' + ${employee.employeeNumber} + ' — ' + ${employee.firstName} + ' ' + ${employee.lastName}"></div>
        </div>
        <a th:href="@{/employees/{id}(id=${employee.employeeNumber})}" class="btn btn-secondary">← Cancel</a>
      </div>

      <div class="card">
        <div class="card-header">✏️ Edit Employee Details</div>
        <div class="card-body">
          <form th:action="@{/employees/{id}/edit(id=${employee.employeeNumber})}" method="post">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">First Name <span class="required">*</span></label>
                <input type="text" name="firstName" class="form-control" required th:value="${employee.firstName}"/>
              </div>
              <div class="form-group">
                <label class="form-label">Last Name <span class="required">*</span></label>
                <input type="text" name="lastName" class="form-control" required th:value="${employee.lastName}"/>
              </div>
              <div class="form-group">
                <label class="form-label">Email <span class="required">*</span></label>
                <input type="email" name="email" class="form-control" required th:value="${employee.email}"/>
              </div>
              <div class="form-group">
                <label class="form-label">Extension <span class="required">*</span></label>
                <input type="text" name="extension" class="form-control" required th:value="${employee.extension}"/>
              </div>
              <div class="form-group">
                <label class="form-label">Job Title <span class="required">*</span></label>
                <input type="text" name="jobTitle" class="form-control" required th:value="${employee.jobTitle}"/>
              </div>
              <div class="form-group">
                <label class="form-label">Office</label>
                <select name="officeCode" class="form-control">
                  <option value="">— No change —</option>
                  <option th:each="o : ${offices}"
                          th:value="${o.officeCode}"
                          th:text="${o.city + ' (' + o.officeCode + ')'}"
                          th:selected="${employee.office != null and employee.office.officeCode == o.officeCode}"></option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Reports To (Manager)</label>
                <select name="managerNumber" class="form-control">
                  <option value="">— No manager —</option>
                  <option th:each="e : ${allEmployees}"
                          th:if="${e.employeeNumber != employee.employeeNumber}"
                          th:value="${e.employeeNumber}"
                          th:text="${e.firstName + ' ' + e.lastName + ' (#' + e.employeeNumber + ')'}"
                          th:selected="${employee.manager != null and employee.manager.employeeNumber == e.employeeNumber}"></option>
                </select>
              </div>
            </div>
            <div style="margin-top:24px;" class="btn-group">
              <button type="submit" class="btn btn-primary">💾 Save Changes</button>
              <a th:href="@{/employees/{id}(id=${employee.employeeNumber})}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
