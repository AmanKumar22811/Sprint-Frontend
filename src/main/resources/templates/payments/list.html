<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payments — Classic Models</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <a class="sidebar-brand" th:href="@{/}"><span class="brand-icon">🏎</span><span>Classic Models</span></a>
    <div class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a th:href="@{/}" class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a>
      <a th:href="@{/analytics}" class="nav-link"><span class="nav-icon">📊</span> Sales Analytics</a>
      <div class="nav-section-label">Modules</div>
      <a th:href="@{/employees}" class="nav-link"><span class="nav-icon">👤</span> Employees</a>
      <a th:href="@{/customers}" class="nav-link"><span class="nav-icon">🤝</span> Customers</a>
      <a th:href="@{/offices}" class="nav-link"><span class="nav-icon">🏢</span> Offices</a>
      <a th:href="@{/orders}" class="nav-link"><span class="nav-icon">📦</span> Orders</a>
      <a th:href="@{/productlines}" class="nav-link"><span class="nav-icon">📋</span> Product Lines</a>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-breadcrumb">
        <a th:href="@{/}">Home</a><span class="sep">/</span><span>Payments</span>
      </div>
      <div class="topbar-title">Payments</div>
    </div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <div class="page-header-title">Payments</div>
          <div class="page-header-sub" th:text="${count} + ' total payments'">0 payments</div>
        </div>
        <a th:href="@{/payments/new}" class="btn btn-success">+ New Payment</a>
      </div>

      <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Customer #</th>
              <th>Customer Name</th>
              <th>Check Number</th>
              <th>Payment Date</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${payments == null or payments.isEmpty()}">
              <td colspan="6">
                <div class="empty-state">
                  <div class="empty-state-icon">💳</div>
                  <div class="empty-state-title">No payments found</div>
                </div>
              </td>
            </tr>
            <tr th:each="p : ${payments}">
              <td th:text="${p.id != null ? p.id.customerNumber : '—'}">-</td>
              <td>
                <a th:if="${p.customer != null}"
                   th:href="@{/customers/{id}(id=${p.customer.customerNumber})}"
                   th:text="${p.customer.customerName}">Customer</a>
                <span th:if="${p.customer == null}">—</span>
              </td>
              <td th:text="${p.id != null ? p.id.checkNumber : '—'}">-</td>
              <td th:text="${p.paymentDate}">-</td>
              <td class="money" th:text="${p.amount != null ? '$' + #numbers.formatDecimal(p.amount,1,2) : '—'}">-</td>
              <td>
                <a th:if="${p.id != null}"
                   th:href="@{/payments/{cn}/{ck}(cn=${p.id.customerNumber},ck=${p.id.checkNumber})}"
                   class="btn btn-secondary btn-sm">View</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
