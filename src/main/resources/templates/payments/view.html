<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment — Classic Models</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <a class="sidebar-brand" th:href="@{/}"><span class="brand-icon">🏎</span><span>Classic Models</span></a>
    <div class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a th:href="@{/}" class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a>
      <a th:href="@{/analytics}" class="nav-link"><span class="nav-icon">📊</span> Sales Analytics</a>
      <div class="nav-section-label">Modules</div>
      <a th:href="@{/employees}" class="nav-link"><span class="nav-icon">👤</span> Employees</a>
      <a th:href="@{/customers}" class="nav-link"><span class="nav-icon">🤝</span> Customers</a>
      <a th:href="@{/offices}" class="nav-link"><span class="nav-icon">🏢</span> Offices</a>
      <a th:href="@{/orders}" class="nav-link"><span class="nav-icon">📦</span> Orders</a>
      <a th:href="@{/productlines}" class="nav-link"><span class="nav-icon">📋</span> Product Lines</a>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-breadcrumb">
        <a th:href="@{/}">Home</a><span class="sep">/</span>
        <a th:href="@{/payments}">Payments</a><span class="sep">/</span>
        <span th:text="${payment.id != null ? payment.id.checkNumber : 'Payment'}">Payment</span>
      </div>
      <div class="topbar-title">Payment Details</div>
    </div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <div class="page-header-title" th:text="'Check: ' + (${payment.id != null ? payment.id.checkNumber : '—'})">Payment</div>
          <div class="page-header-sub" th:text="${payment.customer != null ? payment.customer.customerName : '—'}"></div>
        </div>
        <a th:href="@{/payments}" class="btn btn-secondary">← Back</a>
      </div>

      <div class="card">
        <div class="card-header">💳 Payment Details</div>
        <div class="card-body">
          <div class="detail-grid">
            <div class="detail-item">
              <div class="detail-label">Customer Number</div>
              <div class="detail-value" th:text="${payment.id != null ? payment.id.customerNumber : '—'}">-</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Customer Name</div>
              <div class="detail-value" th:if="${payment.customer != null}">
                <a th:href="@{/customers/{id}(id=${payment.customer.customerNumber})}"
                   th:text="${payment.customer.customerName}">Customer</a>
              </div>
              <div class="detail-value empty" th:if="${payment.customer == null}">—</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Check Number</div>
              <div class="detail-value" th:text="${payment.id != null ? payment.id.checkNumber : '—'}">-</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Payment Date</div>
              <div class="detail-value" th:text="${payment.paymentDate}">-</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Amount</div>
              <div class="detail-value money" style="font-size:1.1rem;color:var(--success);"
                   th:text="${payment.amount != null ? '$' + #numbers.formatDecimal(payment.amount,1,2) : '—'}">-</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
