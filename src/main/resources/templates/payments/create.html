<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Payment — Classic Models</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <a class="sidebar-brand" th:href="@{/}"><span class="brand-icon">🏎</span><span>Classic Models</span></a>
    <div class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a th:href="@{/}" class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a>
      <a th:href="@{/analytics}" class="nav-link"><span class="nav-icon">📊</span> Sales Analytics</a>
      <div class="nav-section-label">Modules</div>
      <a th:href="@{/employees}" class="nav-link"><span class="nav-icon">👤</span> Employees</a>
      <a th:href="@{/customers}" class="nav-link"><span class="nav-icon">🤝</span> Customers</a>
      <a th:href="@{/offices}" class="nav-link"><span class="nav-icon">🏢</span> Offices</a>
      <a th:href="@{/orders}" class="nav-link"><span class="nav-icon">📦</span> Orders</a>
      <a th:href="@{/productlines}" class="nav-link"><span class="nav-icon">📋</span> Product Lines</a>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-breadcrumb">
        <a th:href="@{/}">Home</a><span class="sep">/</span>
        <a th:href="@{/payments}">Payments</a><span class="sep">/</span>
        <span>New Payment</span>
      </div>
      <div class="topbar-title">New Payment</div>
    </div>
    <div class="page-content">
      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <div class="page-header">
        <div class="page-header-title">Create New Payment</div>
        <a th:href="@{/payments}" class="btn btn-secondary">← Back to List</a>
      </div>

      <div class="card">
        <div class="card-header">➕ New Payment Details</div>
        <div class="card-body">
          <form th:action="@{/payments/new}" method="post">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Customer <span class="required">*</span></label>
                <select name="customerNumber" class="form-control" required>
                  <option value="">— Select Customer —</option>
                  <option th:each="c : ${customers}"
                          th:value="${c.customerNumber}"
                          th:text="${c.customerName + ' (#' + c.customerNumber + ')'}"></option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Check Number <span class="required">*</span></label>
                <input type="text" name="checkNumber" class="form-control" required placeholder="e.g. HQ336336"/>
              </div>
              <div class="form-group">
                <label class="form-label">Payment Date <span class="required">*</span></label>
                <input type="date" name="paymentDate" class="form-control" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Amount <span class="required">*</span></label>
                <input type="number" step="0.01" name="amount" class="form-control" required placeholder="0.00" min="0"/>
              </div>
            </div>
            <div style="margin-top:24px;" class="btn-group">
              <button type="submit" class="btn btn-success">✅ Create Payment</button>
              <a th:href="@{/payments}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
